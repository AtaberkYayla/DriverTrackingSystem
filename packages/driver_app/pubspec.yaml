name: driver_app
description: "Dedem Mekatronik Sofor Takip Sistemi - sofor mobil uygulamasi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../core
  flutter_riverpod: ^3.3.2
  http: ^1.2.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^10.3.1
  uuid: ^4.6.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - env/api.json

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
