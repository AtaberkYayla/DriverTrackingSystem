name: admin_web
description: "Dedem Mekatronik Sofor Takip Sistemi - yonetim web paneli."
publish_to: 'none'

version: 1.3.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../core
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  csv: ^8.0.0
  uuid: ^4.6.0
  pdf: ^3.13.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - env/api.json
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

flutter_launcher_icons:
  image_path: "../core/assets/branding/dedem-favicon.png"
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#E2111A"
